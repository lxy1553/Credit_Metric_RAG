services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.5
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports: ["127.0.0.1:9200:9200"]
    volumes: ["elasticsearch-data:/usr/share/elasticsearch/data"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health?wait_for_status=yellow || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    ports: ["127.0.0.1:6389:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 10
  task-redis:
    profiles: ["task-queue"]
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - always
      - --auto-aof-rewrite-percentage
      - "100"
      - --auto-aof-rewrite-min-size
      - 64mb
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction
      - --dir
      - /data
    ports: ["127.0.0.1:6390:6379"]
    volumes: ["task-redis-data:/data"]
    networks: ["credit-task-queue"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 10
  kafka:
    profiles: ["kafka"]
    image: apache/kafka:3.8.1
    ports: ["127.0.0.1:9092:9092"]
    volumes: ["./var/kafka-data:/tmp/kafka-logs"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: EXTERNAL://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: EXTERNAL://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 5s
      timeout: 5s
      retries: 30
  flink-jobmanager:
    profiles: ["flink"]
    image: flink:1.20.1-scala_2.12-java17
    command: jobmanager
    ports: ["127.0.0.1:8081:8081"]
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        jobmanager.memory.process.size: 1024m
        parallelism.default: 1
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/overview"]
      interval: 5s
      timeout: 5s
      retries: 30
  flink-taskmanager:
    profiles: ["flink"]
    image: flink:1.20.1-scala_2.12-java17
    command: taskmanager
    depends_on:
      flink-jobmanager:
        condition: service_healthy
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 1
        taskmanager.memory.process.size: 1024m
  doris:
    profiles: ["doris"]
    image: apache/doris:all-in-one-4.1.3
    ports: ["127.0.0.1:8030:8030", "127.0.0.1:9030:9030"]
    volumes:
      - "./var/doris-fe-meta:/opt/apache-doris/fe/doris-meta"
      - "./var/doris-be-storage:/opt/apache-doris/be/storage"
    environment:
      FE_HEAP: 1024m
      BE_CONFIG_EXTRA: "mem_limit = 30%"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8030/api/health"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  elasticsearch-data:
  task-redis-data:
networks:
  credit-task-queue:
    name: credit-task-queue
